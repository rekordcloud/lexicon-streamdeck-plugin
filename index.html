<!DOCTYPE HTML>
<html>

<head>
  <title>cloud.rekord.lexicon</title>
  <meta charset="utf-8" />
</head>

<body>
  <script src="cue-colors.js"></script>
  <script src="mdi-icons.js"></script>
  <script>
    const API_URL = 'http://localhost:48624/v1/control?app=StreamDeck'
    const DestinationEnum = Object.freeze({ "HARDWARE_AND_SOFTWARE": 0, "HARDWARE_ONLY": 1, "SOFTWARE_ONLY": 2 })

    let websocket = null
    let pluginUUID = null

    var lexiconAction = {
      type: "cloud.rekord.lexicon.action",

      onKeyDown: function (uuid, settings, coordinates, userDesiredState) {
        if (settings.action) {
          const action = settings.action

          const index = (settings.index || 0) - 1 // Zero based in Lexicon
          const amount = settings.amount
          const beats = settings.beats
          const seconds = settings.seconds
          const deckNumber = settings.deckNumber
          const color = settings.color
          const pluginName = settings.pluginName
          const pluginActionName = settings.pluginActionName

          const body = {
            action,
            parameters: {
              index,
              amount,
              beats,
              seconds,
              deckNumber,
              color,
              pluginName,
              pluginActionName
            }
          }

          fetch(API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
          }).catch(console.error)
        } else {
          console.log('no action set')
        }
      },

      onWillAppear: function (context, settings, coordinates) {
        lexiconAction.SetSettings(context, settings)
        lexiconAction.SetImage(context, renderKeyImage(settings && settings.markerColor))
      },

      SetSettings: function (context, settings) {
        const json = {
          "event": "setSettings",
          "context": context,
          "payload": settings
        }

        websocket.send(JSON.stringify(json))
      },

      SetImage: function (context, image) {
        const json = {
          "event": "setImage",
          "context": context,
          "payload": {
            "image": image, // An empty image falls back to the default from the manifest
            "target": DestinationEnum.HARDWARE_AND_SOFTWARE
          }
        }

        websocket.send(JSON.stringify(json))
      }
    }

    const KEY_SIZE = 144

    /*
     * Draws the key image for the chosen setting, either a cue marker or a beatgrid icon.
     * The same images are in images/cues/ and images/icons/, for when you want to set a
     * key image by hand instead. Anything unknown returns an empty image, which makes
     * Stream Deck fall back to the default from the manifest.
     */
    function renderKeyImage (value) {
      if (!value) return ''

      if (value.indexOf('icon:') === 0) return renderIcon(value.slice(5))

      return renderCueMarker(value)
    }

    function createCanvasContext () {
      const canvas = document.createElement('canvas')
      canvas.width = KEY_SIZE
      canvas.height = KEY_SIZE

      return canvas.getContext('2d')
    }

    /*
     * The same cue marker Lexicon paints on the waveform: an isoceles triangle with its
     * flat edge on the top of the key and the apex pointing down.
     */
    function renderCueMarker (color) {
      const hex = CUE_COLORS[color]

      if (!hex) return ''

      const marker = KEY_SIZE * CUE_MARKER_RATIO

      const ctx = createCanvasContext()

      ctx.fillStyle = hex

      ctx.beginPath()
      ctx.moveTo(KEY_SIZE / 2, marker)
      ctx.lineTo((KEY_SIZE + marker) / 2, 0)
      ctx.lineTo((KEY_SIZE - marker) / 2, 0)
      ctx.closePath()

      ctx.fill()

      return ctx.canvas.toDataURL('image/png')
    }

    function renderIcon (name) {
      const icon = MDI_ICONS[name]

      if (!icon) return ''

      const scale = (KEY_SIZE * ICON_RATIO) / MDI_VIEWBOX
      const offset = (KEY_SIZE - MDI_VIEWBOX * scale) / 2

      const ctx = createCanvasContext()

      ctx.translate(offset, offset)
      ctx.scale(scale, scale)

      ctx.fillStyle = '#ffffff'
      ctx.fill(new Path2D(icon.path))

      return ctx.canvas.toDataURL('image/png')
    }

    function connectElgatoStreamDeckSocket (inPort, inPluginUUID, inRegisterEvent, inInfo) {
      pluginUUID = inPluginUUID

      // Open the web socket
      websocket = new WebSocket("ws://localhost:" + inPort)

      function registerPlugin (inPluginUUID) {
        var json = {
          "event": inRegisterEvent,
          "uuid": inPluginUUID
        }

        websocket.send(JSON.stringify(json))
      }

      websocket.onopen = function () {
        registerPlugin(pluginUUID)
      }

      websocket.onmessage = function (evt) {
        const jsonObj = JSON.parse(evt.data)

        const event = jsonObj.event
        const action = jsonObj.action
        const context = jsonObj.context
        const jsonPayload = jsonObj.payload || {}

        if (event == "keyDown") {
          const settings = jsonPayload.settings
          const coordinates = jsonPayload.coordinates
          const userDesiredState = jsonPayload.userDesiredState

          lexiconAction.onKeyDown(context, settings, coordinates, userDesiredState)
        }
        else if (event == "willAppear") {
          const settings = jsonPayload.settings
          const coordinates = jsonPayload.coordinates

          lexiconAction.onWillAppear(context, settings, coordinates)
        }
        else if (event == "sendToPlugin") {
          lexiconAction.SetSettings(context, jsonPayload)
          lexiconAction.SetImage(context, renderKeyImage(jsonPayload.markerColor))
        }
      }

      websocket.onclose = function () { }
    }
  </script>

</body>

</html>
